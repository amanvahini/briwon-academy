        profile: 'College Student',
        preferredMode: 'Offline Classroom'

          setIsScrolled(window.scrollY > 20);

        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
        if (formErrors[name]) {
          setFormErrors(prev => ({ ...prev, [name]: '' }));
        }
      };

      const validateForm = () => {
        const errors = {};
        if (!formData.fullName.trim()) errors.fullName = "Full name is required.";
        // Indian Mobile Number Validation: 10 digits starting with 6, 7, 8, 9
        const cleanMobile = formData.mobile.replace(/\D/g, '');
        if (!cleanMobile) {
          errors.mobile = "Mobile number is required.";
        } else if (!/^[6-9]\d{9}$/.test(cleanMobile)) {
          errors.mobile = "Please enter a valid 10-digit Indian mobile number.";
        }
        if (!formData.email.trim() || !formData.email.includes('@')) {
          errors.email = "Valid email address is required.";
        }
        return errors;
      };

      const handleSubmitLead = (e) => {
        e.preventDefault();
        const errors = validateForm();
        if (Object.keys(errors).length > 0) {
          setFormErrors(errors);
          return;
        }

        setFormStatus('submitting');
        setTimeout(() => {
          setFormStatus('success');
        }, 1000);

                            className="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-xs text-slate-800 outline-none focus:border-briwon-royal bg-white cursor-pointer"
                          >
                            <option value="College Student">College Student</option>
                            <option value="Fresher">Fresher</option>
                            <option value="Job Seeker">Job Seeker</option>
                            <option value="Working Professional">Working Professional</option>
                            <option value="Career Switcher">Career Switcher</option>
                            <option value="Business Owner">Business Owner</option>
                            <option value="Other">Other</option>
                          </select>
                        </div>
                      </div>

                      {/* Preferred Mode */}
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1" htmlFor="preferredMode">
                          Preferred Mode of Training
                        </label>
                        <div className="grid grid-cols-3 gap-2">
                          {["Offline Classroom", "Online Training", "Need Guidance"].map((mode, i) => (
                            <label 
                              key={i} 
                              className={`px-3 py-2 rounded-lg border text-center text-xs font-medium cursor-pointer transition-colors ${
                                formData.preferredMode === mode 
                                  ? 'bg-blue-50 border-briwon-royal text-briwon-deep font-bold' 
                                  : 'border-slate-200 text-slate-600 hover:bg-slate-50'
                              }`}
                            >
                              <input
                                type="radio"
                                name="preferredMode"
                                value={mode}
                                checked={formData.preferredMode === mode}
                                onChange={handleInputChange}
                                className="sr-only"
                              />
                              {mode}
                            </label>
                          ))}
                        </div>
                      </div>

                      {/* Submit Button */}
                      <button
                        type="submit"
                        disabled={formStatus === 'submitting'}
                        className="w-full py-3.5 px-4 rounded-xl bg-briwon-deep hover:bg-briwon-royal text-white font-bold text-xs tracking-wider uppercase transition-all shadow-md flex items-center justify-center gap-2 mt-2"
                      >
                        {formStatus === 'submitting' ? (
                          <>
                            <svg className="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                              <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                              <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span>Submitting Enquiry...</span>
                          </>
                        ) : (
                          <>
                            <span>GET COURSE DETAILS</span>
                            <ArrowRightIcon className="w-4 h-4" />
                          </>
                        )}
                      </button>

                      <div className="text-center text-[11px] text-slate-400">
                        🔒 We value your privacy. No spam. Fast callback from official admissions.
                      </div>

                    </form>
                  </>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BriwonAcademyApp />);
  </script>
</body>
</html>
